<!DOCTYPE html>
<!--
  {{NAME}}.html — AutoFlow inpage 承载页（同源）
  ⚠️ 内部自动化页面：noindex；上线前请删除或加访问控制。
  说明：浏览器同源策略限制，本页只能驱动与自身同源的页面。跨域请用 Playwright 产物。
-->
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store, must-revalidate" />
  <meta name="robots" content="noindex, nofollow" />
  <title>{{TITLE_HTML}}</title>
  <meta name="description" content="{{DESCRIPTION_HTML}}" />
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f7f8fc;
      font-family: "Nunito", "Noto Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #af-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>

<body>
  <iframe id="af-frame" src="{{IFRAME_SRC}}" title="{{TITLE_HTML}}"></iframe>

  <script>
    // 可由部署方在页面加载前覆盖：window.AUTOFLOW_VARS / window.AUTOFLOW_SECRETS
    window.AUTOFLOW_VARS = window.AUTOFLOW_VARS || {{INITIAL_VARS_JS}};
    window.AUTOFLOW_SECRETS = window.AUTOFLOW_SECRETS || {};
  </script>

  <!-- AutoFlow inpage runtime（内联，保证单文件可分发） -->
  <script>
{{RUNTIME_JS}}
  </script>

  <script>
    (function () {
      var AUTOFLOW_SPEC = {{SPEC_JSON}};
      AutoFlow.mount({
        spec: AUTOFLOW_SPEC,
        iframeId: "af-frame",
        vars: window.AUTOFLOW_VARS,
        secrets: window.AUTOFLOW_SECRETS
      });
    })();
  </script>

  <noscript>此页面需要启用 JavaScript。</noscript>
</body>

</html>
