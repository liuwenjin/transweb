  <script>
    window.dataLayer = window.dataLayer || [];

    function gtag() {
      dataLayer.push(arguments);
    }

    gtag('js', new Date());
    gtag('config', 'G-K117F271PB', {
      send_page_view: true
    });

    (function () {
      function track(eventName, params = {}) {
        gtag('event', eventName, {
          page_title: document.title,
          page_location: location.href,
          ...params
        });
      }

      window.$track = track;

      window.addEventListener('load', () => {
        $track('page_view_custom');
      });

      document.addEventListener('click', function (e) {
        const target = e.target.closest('.aigcBtn');

        if (target) {
          const moduleName = target.dataset.name || target.innerText || 'unknown_module';

          $track('module_click', {
            module_name: moduleName
          });
        }
      });

      window.onModuleLoaded = function (moduleName) {
        $track('module_enter', {
          module_name: moduleName
        });
      };

      let hasInteracted = false;

      ['click', 'mousemove', 'keydown', 'touchstart'].forEach(evt => {
        window.addEventListener(evt, () => {
          if (!hasInteracted) {
            hasInteracted = true;
            $track('interaction', {
              type: evt
            });
          }
        });
      });

      setTimeout(() => {
        $track('stay_10s');
      }, 10000);

      setTimeout(() => {
        $track('stay_30s');
      }, 30000);

      window.addEventListener('beforeunload', () => {
        $track('page_exit');
      });
    })();
  </script>

  <!-- ===== 页面逻辑 ===== -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {

      let tRadio = Number(WebTool.urlQuery(location.href, 'transformRadio'));

      if (tRadio !== 1) {
        WebTool.adjustStyle(480);
      } else {
        window.transformRadio = tRadio;
      }

      webCpu.isContainerUpdated = 'false';

      let tElem = document.querySelector('.documentId');

      let readOnly = WebTool.urlQuery(location.href, 'readOnly') === 'true';

      if (readOnly) {
        document.querySelector('.bottomInfo').style.display = 'none';
        document.querySelector('.contentItemArea').style.paddingBottom = '0';
      }

      let documentId = tElem.innerHTML.trim();

      window.lang = 'zh';

      let updateDocumentApp = function (appItem, callback) {

        let content = appItem.content.constructor.name !== 'Array'
          ? [{ content: appItem.content }]
          : appItem.content;

        content[0].content.isSolo = true;

        window.aigcRequest = function (query, callback, errCallback, macros) {
          query.rootAccount = appItem.documentMeta.rootAccount;
          aigcInterface.request(query, callback, errCallback, macros);
        };

        appItem.documentMeta.documentId = documentId;

        let mainApp = {
          url: webCpu.documentPrefix + '/webApps/document/agent.vue',
          cardName: 'documentEditor',
          dsl: {
            data: {
              topHeaderHidden: true,
              breadcrumbsHidden: true,
              currentContent: content,
              currentApp: appItem.app,
              documentMeta: appItem.documentMeta
            }
          }
        };

        let elem = document.querySelector('.contentItemArea');

        webCpu.updateView(elem, mainApp, callback);
      };

      let updateMenuItem = function (appId) {

        let app = {
          url: webCpu.documentPrefix + '/components/menu.vue',
          cardName: 'documentAgentMenu',
          dsl: {
            data: {
              appId: appId
            }
          }
        };

        let elem = document.querySelector('.agentMenuArea');

        webCpu.updateView(elem, app);
      };

      webCpu.getDocumentApp(
        documentId,
        (app, content, rData) => {

          updateDocumentApp(rData, () => {

            rData.documentMeta = rData.documentMeta || {};

            if (localStorage.folderName === rData.documentMeta.folderName) {
              updateMenuItem(documentId);
              document.querySelector('.bottomInfo').style.display = 'flex';
              document.querySelector('.contentItemArea').style.paddingBottom = '44px';
            } else {
              document.querySelector('.bottomInfo').style.display = 'none';
              document.querySelector('.contentItemArea').style.paddingBottom = '0';
            }
          });
        },
        (err) => {
          console.error('加载文档失败', err);

          let elem = document.querySelector('.contentItemArea');

          elem.innerHTML = `
            <div class="tw-bg-white tw-rounded-2xl tw-shadow-card tw-p-8 tw-max-w-md tw-text-center">
              <h2 class="tw-text-2xl tw-font-bold tw-text-red-500 tw-mb-3">
                加载失败
              </h2>
              <p class="tw-text-gray-500">
                学术论文内容加载失败，请稍后重试。
              </p>
            </div>
          `;
        }
      );
    });
  </script>
