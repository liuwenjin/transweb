<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <title>数形实验台 - 交互式基础几何动态演示与数学探索工具</title>
  <meta name="description" content="数形实验台是一个专注于基础几何教育的交互式平台。通过数形结合技术，将抽象的数学定理转化为直观的动态演示，支持几何绘图、动态变量控制及教学场景模拟，助力数学直观教学。" />
  <meta name="keywords" content="数形实验台,几何演示,动态几何,数学实验,交互式课件,基础几何,数学可视化,Transweb" />
  <meta name="author" content="Transweb" />

  <meta property="og:title" content="数形实验台 - 让几何动起来" />
  <meta property="og:description" content="通过交互式实验，深度理解几何逻辑，让数学学习变得直观简单。" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://transweb.cn/logo.png" /> <link rel="preconnect" href="https://transweb.cn" />

  <style>
    :root {
      --primary-color: #67cf22;
      --text-muted: #888;
      --bg-glass: rgba(255, 255, 255, 0.9);
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: "Nunito", "Noto Sans SC", -apple-system, sans-serif;
      overflow: hidden;
      box-sizing: border-box;
      background-color: #fcfcfc;
    }

    /* 语义化容器：主内容区 */
    main.contentItemArea {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
    }

    /* 底部交互区：毛玻璃效果 */
    footer.bottomInfo {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      display: none; /* 由 JS 动态控制显示 */
      align-items: center;
      justify-content: center;
      height: 48px;
      padding: 0 20px;
      background: var(--bg-glass);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-top: 1px solid rgba(0, 0, 0, 0.05);
      font-size: 12px;
      color: var(--text-muted);
      z-index: 1000;
      box-sizing: border-box;
    }

    .agentMenuArea {
      display: flex;
      align-items: center;
      margin-left: 12px;
      height: 40px;
      width: 500px;
      white-space: nowrap;
    }

    /* 加载动画优化 */
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .loadingTips {
      font-size: 14px;
      color: #999;
      letter-spacing: 1px;
    }

    .waiting {
      width: 40px;
      height: 40px;
      background-color: var(--primary-color);
      border-radius: 4px;
      animation: rotateplane 1.2s infinite ease-in-out;
      box-shadow: 0 4px 12px rgba(103, 207, 34, 0.3);
    }

    @keyframes rotateplane {
      0% { transform: perspective(120px) rotateX(0deg) rotateY(0deg); }
      50% { transform: perspective(120px) rotateX(-180deg) rotateY(0deg); }
      100% { transform: perspective(120px) rotateX(-180deg) rotateY(-179.9deg); }
    }

    /* 错误提示样式 */
    .error-msg {
      color: #f56c6c;
      background: #fef0f0;
      padding: 12px 24px;
      border-radius: 8px;
      border: 1px solid #fde2e2;
    }
  </style>
</head>

<body>
  <main class="contentItemArea" role="main">
    <div class="loading-container">
      <div class="waiting"></div>
      <div class="loadingTips">数学实验室正在准备中...</div>
    </div>
  </main>

  <footer class="bottomInfo">
    <div class="agentMenuArea"></div>
    <template id="documentIdData">28e55cff1a46d1d7cf66c4aa6a898460</template>
  </footer>

  <script defer src="https://transweb.cn/index.js"></script>
  
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      // 1. 初始化配置
      const urlParams = new URLSearchParams(window.location.search);
      const tRadio = Number(urlParams.get("transformRadio"));
      const isReadOnly = urlParams.get("readOnly") === "true";
      const docElem = document.getElementById("documentIdData");
      const documentId = docElem ? docElem.innerHTML.trim() : "";
      
      if (tRadio !== 1) {
        WebTool.adjustStyle(480);
      } else {
        window.transformRadio = tRadio;
      }
      
      webCpu.isContainerUpdated = "false";
      window.lang = "zh";

      // 2. 界面控制逻辑
      const toggleUI = (show) => {
        const footer = document.querySelector(".bottomInfo");
        const main = document.querySelector(".contentItemArea");
        if (show && !isReadOnly) {
          footer.isDisplayed = true;
          footer.style.display = "flex";
          main.style.paddingBottom = "48px";
        } else {
          footer.style.display = "none";
          main.style.paddingBottom = "0";
        }
      };

      // 3. 应用更新引擎
      const updateDocumentApp = (appItem, callback) => {
        let content = Array.isArray(appItem.content) ? appItem.content : [{ content: appItem.content }];
        content[0].content.isSolo = true;
        
        window.aigcRequest = (query, cb, errCb, macros) => {
          query.rootAccount = appItem.documentMeta.rootAccount;
          aigcInterface.request(query, cb, errCb, macros);
        };

        appItem.documentMeta.documentId = documentId;
        
        const mainApp = {
          url: `${webCpu.documentPrefix}/webApps/document/agent.vue`,
          cardName: "documentEditor",
          dsl: {
            data: {
              topHeaderHidden: true,
              breadcrumbsHidden: true,
              currentContent: content,
              currentApp: appItem.app,
              documentMeta: appItem.documentMeta
            }
          }
        };

        webCpu.updateView(document.querySelector(".contentItemArea"), mainApp, callback);
      };

      const updateMenuItem = (id) => {
        const menuApp = {
          url: `${webCpu.documentPrefix}/components/menu.vue`,
          cardName: "documentAgentMenu",
          dsl: { data: { appId: id } }
        };
        webCpu.updateView(document.querySelector(".agentMenuArea"), menuApp);
      };

      // 4. 执行加载
      if (documentId) {
        webCpu.getDocumentApp(
          documentId,
          (app, content, rData) => {
            updateDocumentApp(rData, () => {
              rData.documentMeta = rData.documentMeta || {};
              // 校验本地存储状态，决定是否显示编辑菜单
              if (localStorage.folderName === rData.documentMeta.folderName) {
                toggleUI(true);
                updateMenuItem(documentId);
              } else {
                toggleUI(false);
              }
            });
          },
          (err) => {
            console.error("加载文档失败", err);
            document.querySelector(".contentItemArea").innerHTML = 
              '<div class="error-msg">数形实验加载失败，请检查网络或刷新重试。</div>';
          }
        );
      }
    });
  </script>
</body>
</html>
