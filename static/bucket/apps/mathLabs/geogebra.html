      flex-direction: column;
      align-items: center;
      gap: 20px;

      font-size: 14px;
      color: #999;
      letter-spacing: 1px;
    }

      width: 40px;
      height: 40px;
      background-color: var(--primary-color);
      border-radius: 4px;
      animation: rotateplane 1.2s infinite ease-in-out;
      box-shadow: 0 4px 12px rgba(103, 207, 34, 0.3);
    }

    @keyframes rotateplane {
      0% {
        transform: perspective(120px) rotateX(0deg) rotateY(0deg);
      }

      50% {
        transform: perspective(120px) rotateX(-180deg) rotateY(0deg);
      }

      100% {
        transform: perspective(120px) rotateX(-180deg) rotateY(-179.9deg);
      }
    }

    var LS_KEY = "appLang";
    var EN_URL = "./i18n/en.json";
    var EN_CACHE_KEY = "i18n_en_v1";

    var lang = "zh";
    try {
      lang = localStorage.getItem(LS_KEY) || "zh";
    } catch (e) { }
    if (lang !== "en" && lang !== "zh") lang = "zh";

    window.__I18N__ = I18N;
    window.__APP_LANG__ = lang;
    window.lang = lang;

    window.__t__ = function (key) {
      if (I18N[lang] && I18N[lang][key] !== undefined) return I18N[lang][key];
      if (I18N.zh[key] !== undefined) return I18N.zh[key];
      return key;
    };

    function apply(l) {
      document.documentElement.lang = l === "en" ? "en" : "zh-CN";
      var dict = I18N[l] || I18N.zh;

      document.title = dict.title;

      var nodes = document.querySelectorAll("[data-i18n]");
      for (var i = 0; i < nodes.length; i++) {
        var key = nodes[i].getAttribute("data-i18n");
        if (dict[key] !== undefined) nodes[i].textContent = dict[key];
      }

      var ariaNodes = document.querySelectorAll("[data-i18n-aria]");
      for (var j = 0; j < ariaNodes.length; j++) {
        var ariaKey = ariaNodes[j].getAttribute("data-i18n-aria");
        if (dict[ariaKey] !== undefined) ariaNodes[j].setAttribute("aria-label", dict[ariaKey]);
      }

      var toggle = document.getElementById("langToggle");
      if (toggle) {
        toggle.textContent = l === "en" ? "中文" : "EN";
        toggle.setAttribute("aria-label", l === "en" ? "切换到中文" : "Switch to English");
      }
    }

    function commit(next) {
      lang = next;
      window.lang = lang;
      window.__APP_LANG__ = lang;
      try {
        localStorage.setItem(LS_KEY, lang);
      } catch (e) { }
      apply(lang);
      try {
        window.dispatchEvent(new CustomEvent("applangchange", { detail: { lang: lang } }));
      } catch (e) { }
      try {
        if (window.webCpu && webCpu.mitt) webCpu.mitt.emit("langChanged", lang);
      } catch (e) { }
    }

    // 按需加载英文词典：优先内存，其次 localStorage 缓存，最后网络请求
    function ensureDict(l, done) {
      if (l === "zh") return done("zh");
      if (I18N.en) return done("en");

      var cached = null;
      try { cached = localStorage.getItem(EN_CACHE_KEY); } catch (e) { }
      if (cached) {
        try { I18N.en = JSON.parse(cached); } catch (e) { I18N.en = null; }
        if (I18N.en) return done("en");
      }

      fetch(EN_URL)
        .then(function (r) { return r.json(); })
        .then(function (data) {
          I18N.en = data;
          try { localStorage.setItem(EN_CACHE_KEY, JSON.stringify(data)); } catch (e) { }
          done("en");
        })
        .catch(function () { done("zh"); });
    }

    window.__setAppLang__ = function (next) {
      if (next !== "en") next = "zh";
      ensureDict(next, commit);
    };

    // 初始应用：若上次选择英文，异步加载后再应用
    ensureDict(lang, function (resolved) {
      lang = resolved;
      window.__APP_LANG__ = resolved;
      apply(resolved);
    });

    document.addEventListener('DOMContentLoaded', function () {
      aigcInterface.init();
      // 1. 初始化配置
      const urlParams = new URLSearchParams(window.location.search);
      const tRadio = Number(urlParams.get("transformRadio"));
      const isReadOnly = urlParams.get("readOnly") === "true";
      const docElem = document.getElementById("documentIdData");
      const documentId = docElem ? docElem.innerHTML.trim() : "";

      if (tRadio !== 1) {
        WebTool.adjustStyle(480);
      } else {
        window.transformRadio = tRadio;
      }

      webCpu.isContainerUpdated = "false";
      window.lang = "zh";

      // 2. 界面控制逻辑
      const toggleUI = (show) => {
        const footer = document.querySelector(".bottomInfo");
        const main = document.querySelector(".contentItemArea");
        if (show && !isReadOnly) {
          footer.isDisplayed = true;
          footer.style.display = "flex";
          main.style.paddingBottom = "48px";
        } else {
          footer.style.display = "none";
          main.style.paddingBottom = "0";
        }
      };

      // 3. 应用更新引擎
      const updateDocumentApp = (appItem, callback) => {
        let content = Array.isArray(appItem.content) ? appItem.content : [{ content: appItem.content }];
        content[0].content.isSolo = true;

        window.aigcRequest = (query, cb, errCb, macros) => {
          query.rootAccount = appItem.documentMeta.rootAccount;
          aigcInterface.request(query, cb, errCb, macros);
        };

        appItem.documentMeta.documentId = documentId;

        const mainApp = {
          url: `${webCpu.documentPrefix}/webApps/document/agent.vue`,
          cardName: "documentEditor",
          dsl: {
            data: {
              topHeaderHidden: true,
              breadcrumbsHidden: true,
              currentContent: content,
              currentApp: appItem.app,
              documentMeta: appItem.documentMeta
            }
          }
        };

        webCpu.updateView(document.querySelector(".contentItemArea"), mainApp, callback);
      };

      const updateMenuItem = (id) => {
        const menuApp = {
          url: `${webCpu.documentPrefix}/components/menu.vue`,
          cardName: "documentAgentMenu",
          dsl: { data: { appId: id } }
        };
        webCpu.updateView(document.querySelector(".agentMenuArea"), menuApp);
      };

      // 4. 执行加载
      if (documentId) {
        webCpu.getDocumentApp(
          documentId,
          (app, content, rData) => {
            updateDocumentApp(rData, () => {
              rData.documentMeta = rData.documentMeta || {};
              // 校验本地存储状态，决定是否显示编辑菜单
              if (localStorage.folderName === rData.documentMeta.folderName) {
                toggleUI(true);
                updateMenuItem(documentId);
              } else {
                toggleUI(false);
              }
            });
          },
          (err) => {
            console.error("加载文档失败", err);
            document.querySelector(".contentItemArea").innerHTML =
              '<div class="error-msg">数形实验加载失败，请检查网络或刷新重试。</div>';
          }
        );
      }
    });
  </script>
