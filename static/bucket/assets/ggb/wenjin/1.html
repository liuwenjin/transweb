<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>傅里叶级数：用圆周运动画出任意闭合曲线</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: "Nunito", "Noto Sans", sans-serif;
      overflow: hidden;
      box-sizing: border-box;
    }

    .contentItemArea {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
    }


    @keyframes hueShift {
      0% {
        filter: hue-rotate(0deg);
      }

      100% {
        filter: hue-rotate(360deg);
      }
    }

    .fade-out {
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    .loadingTips {
      text-align: center;
      font-size: 12px;
      color: #ccc;
      padding: 20px 0;
    }

    .waiting {
      width: 60px;
      height: 60px;
      background-color: #67cf22;
      margin: 100px auto;
      animation: rotateplane 1.2s infinite ease-in-out;
    }

    @keyframes rotateplane {
      0% {
        transform: perspective(120px) rotateX(0deg) rotateY(0deg);
      }

      50% {
        transform: perspective(120px) rotateX(-180deg) rotateY(0deg);
      }

      100% {
        transform: perspective(120px) rotateX(-180deg) rotateY(-179.9deg);
      }
    }

    .__exporting__,
    .__exporting * {
      animation: none !important;
      transition: none !important;
    }

    .__exporting {
      background: #ffffff !important;
    }

    .__export-mask {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      background: rgba(250, 250, 250, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .__export-mask__panel {
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 16px 22px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
    }

    .__export-mask__spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div class="contentItemArea">
    <div class="loadingTips">加载中...</div>
    <div class="waiting"></div>
  </div>
  <script defer src="https://transweb.cn/index.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      let app = {
        className: "GeogebraCase",
        task: {
          data: {
            name: "傅里叶级数：用圆周运动画出任意闭合曲线",
            mode: "2D",
            appName: "suite",
            perspective: "graphing",
            language: "zh-CN",
            version: 5.0,
            script: {
              value: `SetCoordSystem(-8, 8, -8, 8)
ShowGrid(true)
ShowAxes(true)
N = Slider(1, 10, 1, 1, 150)
SetCaption(N, "$\text{项数 } N$")
SetLabelMode(N, 3)
ShowLabel(N, true)
R_1 = Slider(0.5, 3, 0.1, 1, 150)
SetCaption(R_1, "$\text{基圆半径 } R_1$")
SetLabelMode(R_1, 3)
ShowLabel(R_1, true)
R_2 = Slider(0, 2, 0.1, 1, 150)
SetCaption(R_2, "$\text{第2圆半径 } R_2$")
SetLabelMode(R_2, 3)
ShowLabel(R_2, true)
R_3 = Slider(0, 1.5, 0.1, 1, 150)
SetCaption(R_3, "$\text{第3圆半径 } R_3$")
SetLabelMode(R_3, 3)
ShowLabel(R_3, true)
F_2 = Slider(-5, 5, 1, 1, 150)
SetCaption(F_2, "$\text{第2圆频率 } f_2$")
SetLabelMode(F_2, 3)
ShowLabel(F_2, true)
F_3 = Slider(-5, 5, 1, 1, 150)
SetCaption(F_3, "$\text{第3圆频率 } f_3$")
SetLabelMode(F_3, 3)
ShowLabel(F_3, true)
T = Slider(0, 1, 0.001, 0.01, 200)
SetCaption(T, "$\text{时间 } t$")
SetLabelMode(T, 3)
ShowLabel(T, true)
Angle_1 = 2 * pi * T
Angle_2 = 2 * pi * F_2 * T
Angle_3 = 2 * pi * F_3 * T
O = (0, 0)
SetPointSize(O, 4)
SetPointStyle(O, 0)
ShowLabel(O, false)
P_1 = O + (R_1 * cos(Angle_1), R_1 * sin(Angle_1))
SetPointSize(P_1, 4)
SetPointStyle(P_1, 0)
ShowLabel(P_1, false)
P_2 = P_1 + (R_2 * cos(Angle_2), R_2 * sin(Angle_2))
SetPointSize(P_2, 4)
SetPointStyle(P_2, 0)
ShowLabel(P_2, false)
P_3 = P_2 + (R_3 * cos(Angle_3), R_3 * sin(Angle_3))
SetPointSize(P_3, 5)
SetPointStyle(P_3, 0)
SetColor(P_3, "#FF0000")
SetCaption(P_3, "$\text{合成点}$")
SetLabelMode(P_3, 3)
ShowLabel(P_3, true)
Cir_1 = Circle(O, R_1)
SetLineThickness(Cir_1, 1)
SetColor(Cir_1, "#888888")
ShowLabel(Cir_1, false)
Cir_2 = Circle(P_1, R_2)
SetLineThickness(Cir_2, 1)
SetColor(Cir_2, "#888888")
ShowLabel(Cir_2, false)
Cir_3 = Circle(P_2, R_3)
SetLineThickness(Cir_3, 1)
SetColor(Cir_3, "#888888")
ShowLabel(Cir_3, false)
Seg_1 = Segment(O, P_1)
SetLineThickness(Seg_1, 1)
SetColor(Seg_1, "#AAAAAA")
ShowLabel(Seg_1, false)
Seg_2 = Segment(P_1, P_2)
SetLineThickness(Seg_2, 1)
SetColor(Seg_2, "#AAAAAA")
ShowLabel(Seg_2, false)
Seg_3 = Segment(P_2, P_3)
SetLineThickness(Seg_3, 1)
SetColor(Seg_3, "#AAAAAA")
ShowLabel(Seg_3, false)
Locus_1 = Locus(P_3, T)
SetLineThickness(Locus_1, 3)
SetColor(Locus_1, "#FF0000")
ShowLabel(Locus_1, false)
ShowObject(Cir_2, R_2 > 0)
ShowObject(Cir_3, R_3 > 0)
ShowObject(Seg_2, R_2 > 0)
ShowObject(Seg_3, R_3 > 0)
ShowObject(P_2, R_2 > 0)
`,
            }
          }
        }
      };
      let elem = document.querySelector(".contentItemArea");
      webCpu.updateView(elem, app);
    });
  </script>
</body>

</html>
