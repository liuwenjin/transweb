<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>导数切线的滑行</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: "Nunito", "Noto Sans", sans-serif;
      overflow: hidden;
      box-sizing: border-box;
    }

    .contentItemArea {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
    }


    @keyframes hueShift {
      0% {
        filter: hue-rotate(0deg);
      }

      100% {
        filter: hue-rotate(360deg);
      }
    }

    .fade-out {
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    .loadingTips {
      text-align: center;
      font-size: 12px;
      color: #ccc;
      padding: 20px 0;
    }

    .waiting {
      width: 60px;
      height: 60px;
      background-color: #67cf22;
      margin: 100px auto;
      animation: rotateplane 1.2s infinite ease-in-out;
    }

    @keyframes rotateplane {
      0% {
        transform: perspective(120px) rotateX(0deg) rotateY(0deg);
      }

      50% {
        transform: perspective(120px) rotateX(-180deg) rotateY(0deg);
      }

      100% {
        transform: perspective(120px) rotateX(-180deg) rotateY(-179.9deg);
      }
    }

    .__exporting__,
    .__exporting * {
      animation: none !important;
      transition: none !important;
    }

    .__exporting {
      background: #ffffff !important;
    }

    .__export-mask {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      background: rgba(250, 250, 250, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .__export-mask__panel {
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 16px 22px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
    }

    .__export-mask__spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div class="contentItemArea">
    <div class="loadingTips">加载中...</div>
    <div class="waiting"></div>
  </div>
  <script defer src="https://transweb.cn/index.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      let app = {
        className: "GeogebraCase",
        task: {
          data: {
            name: "导数切线的滑行",
            mode: "2D",
            appName: "suite",
            perspective: "graphing",
            language: "zh-CN",
            version: 5.0,
            script: {
              value: `SetCoordSystem(-8,8,-8,8)
ShowGrid(true)
ShowAxes(true)

f(x) = x^3/8 - x^2/4 - x + 2

X_pt = Slider(-4, 5, 0.01, 1, 150)
P = (X_pt, f(X_pt))

m = Derivative(f, x)
k = m(X_pt)

tan_line = Tangent(X_pt, f)

deriv_curve = Function(m, -4, 5)
Q = (X_pt, k)

SetColor(f, "#2563EB")
SetLineThickness(f, 3)
SetColor(tan_line, "#DC2626")
SetLineThickness(tan_line, 2)
SetColor(deriv_curve, "#16A34A")
SetLineThickness(deriv_curve, 3)
SetPointSize(P, 4)
SetPointStyle(P, 0)
SetColor(P, "#2563EB")
SetPointSize(Q, 4)
SetPointStyle(Q, 0)
SetColor(Q, "#16A34A")

SetCaption(P, "切点 P")
SetLabelMode(P, 3)
ShowLabel(P, true)
SetCaption(Q, "导数值 Q")
SetLabelMode(Q, 3)
ShowLabel(Q, true)
SetCaption(X_pt, "拖动 x 坐标")
SetLabelMode(X_pt, 3)
ShowLabel(X_pt, true)

ShowObject(deriv_curve, true)
ShowObject(tan_line, true)
ShowObject(P, true)
ShowObject(Q, true)`,
            }
          }
        }
      };
      let elem = document.querySelector(".contentItemArea");
      webCpu.updateView(elem, app);
    });
  </script>
</body>

</html>
