<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>黎曼和的切片极限</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: "Nunito", "Noto Sans", sans-serif;
      overflow: hidden;
      box-sizing: border-box;
    }

    .contentItemArea {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
    }


    @keyframes hueShift {
      0% {
        filter: hue-rotate(0deg);
      }

      100% {
        filter: hue-rotate(360deg);
      }
    }

    .fade-out {
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    .loadingTips {
      text-align: center;
      font-size: 12px;
      color: #ccc;
      padding: 20px 0;
    }

    .waiting {
      width: 60px;
      height: 60px;
      background-color: #67cf22;
      margin: 100px auto;
      animation: rotateplane 1.2s infinite ease-in-out;
    }

    @keyframes rotateplane {
      0% {
        transform: perspective(120px) rotateX(0deg) rotateY(0deg);
      }

      50% {
        transform: perspective(120px) rotateX(-180deg) rotateY(0deg);
      }

      100% {
        transform: perspective(120px) rotateX(-180deg) rotateY(-179.9deg);
      }
    }

    .__exporting__,
    .__exporting * {
      animation: none !important;
      transition: none !important;
    }

    .__exporting {
      background: #ffffff !important;
    }

    .__export-mask {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      background: rgba(250, 250, 250, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .__export-mask__panel {
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 16px 22px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
    }

    .__export-mask__spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div class="contentItemArea">
    <div class="loadingTips">加载中...</div>
    <div class="waiting"></div>
  </div>
  <script defer src="https://transweb.cn/index.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      let app = {
        className: "GeogebraCase",
        task: {
          data: {
            name: "黎曼和的切片极限",
            mode: "2D",
            appName: "suite",
            perspective: "graphing",
            language: "zh-CN",
            version: 5.0,
            script: {
              value: `SetCoordSystem(-1, 7, -1, 5)
ShowGrid(false)
ShowAxes(true)
N_s = Slider(1, 50, 1, 1, 150)
SetCaption(N_s, "切片数 N = %v")
SetLabelMode(N_s, 3)
ShowLabel(N_s, true)
f_x(x) = -0.1*(x - 3)^3 + 0.5*(x - 3)^2 + 1.5
A_f = (1, 0)
B_f = (6, 0)
A_t = (1, f_x(1))
B_t = (6, f_x(6))
aux_dx = (x(B_f) - x(A_f)) / N_s
aux_rects = Sequence(Polygon((x(A_f) + (i-1)*aux_dx, 0), (x(A_f) + i*aux_dx, 0), (x(A_f) + i*aux_dx, f_x(x(A_f) + i*aux_dx)), (x(A_f) + (i-1)*aux_dx, f_x(x(A_f) + i*aux_dx))), i, 1, N_s)
SetColor(aux_rects, "#3B82F6")
SetFilling(aux_rects, 0.4)
SetLineThickness(aux_rects, 1)
aux_curve = Function(f_x, 1, 6)
SetColor(aux_curve, "#EF4444")
SetLineThickness(aux_curve, 4)
aux_area = Integral(f_x, 1, 6)
SetCaption(aux_area, "精确面积 ≈ 10.42")
SetLabelMode(aux_area, 3)
ShowLabel(aux_area, true)
aux_sum = Sum(Sequence(f_x(x(A_f) + i*aux_dx) * aux_dx, i, 1, N_s))
SetCaption(aux_sum, "矩形和 ≈ 10.42")
SetLabelMode(aux_sum, 3)
ShowLabel(aux_sum, true)
ShowObject(A_t, false)
ShowObject(B_t, false)
ShowLabel(A_f, false)
ShowLabel(B_f, false)
ShowLabel(A_t, false)
ShowLabel(B_t, false)
ShowLabel(aux_dx, false)
ShowLabel(aux_curve, false)`,
            }
          }
        }
      };
      let elem = document.querySelector(".contentItemArea");
      webCpu.updateView(elem, app);
    });
  </script>
</body>

</html>
