<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>函数图像的仿射变换</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: "Nunito", "Noto Sans", sans-serif;
      overflow: hidden;
      box-sizing: border-box;
    }

    .contentItemArea {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
    }


    @keyframes hueShift {
      0% {
        filter: hue-rotate(0deg);
      }

      100% {
        filter: hue-rotate(360deg);
      }
    }

    .fade-out {
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    .loadingTips {
      text-align: center;
      font-size: 12px;
      color: #ccc;
      padding: 20px 0;
    }

    .waiting {
      width: 60px;
      height: 60px;
      background-color: #67cf22;
      margin: 100px auto;
      animation: rotateplane 1.2s infinite ease-in-out;
    }

    @keyframes rotateplane {
      0% {
        transform: perspective(120px) rotateX(0deg) rotateY(0deg);
      }

      50% {
        transform: perspective(120px) rotateX(-180deg) rotateY(0deg);
      }

      100% {
        transform: perspective(120px) rotateX(-180deg) rotateY(-179.9deg);
      }
    }

    .__exporting__,
    .__exporting * {
      animation: none !important;
      transition: none !important;
    }

    .__exporting {
      background: #ffffff !important;
    }

    .__export-mask {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      background: rgba(250, 250, 250, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .__export-mask__panel {
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 16px 22px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
    }

    .__export-mask__spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div class="contentItemArea">
    <div class="loadingTips">加载中...</div>
    <div class="waiting"></div>
  </div>
  <script defer src="https://transweb.cn/index.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      let app = {
        className: "GeogebraCase",
        task: {
          data: {
            name: "函数图像的仿射变换",
            mode: "2D",
            appName: "suite",
            perspective: "graphing",
            language: "zh-CN",
            version: 5.0,
            script: {
              value: `SetCoordSystem(-8,8,-8,8)
ShowGrid(true)
ShowAxes(true)
Tx = Slider(-5, 5, 0.1, 1, 150)
Ty = Slider(-5, 5, 0.1, 1, 150)
Sh_x = Slider(-2, 2, 0.1, 1, 150)
Sc_x = Slider(0.2, 3, 0.1, 1, 150)
Sc_y = Slider(0.2, 3, 0.1, 1, 150)
f_orig(x) = sin(x)
f_trans(x) = Sc_y * f_orig((x - Tx - Sh_x * (f_orig(x) - Ty)) / Sc_x) + Ty
Curve_orig = Curve(t, f_orig(t), t, -8, 8)
Curve_trans = Curve(t, f_trans(t), t, -8, 8)
SetColor(Curve_orig, "#3498DB")
SetLineThickness(Curve_orig, 3)
SetColor(Curve_trans, "#E74C3C")
SetLineThickness(Curve_trans, 4)
SetCaption(Tx, "水平平移 Tx")
SetLabelMode(Tx, 3)
ShowLabel(Tx, true)
SetCaption(Ty, "垂直平移 Ty")
SetLabelMode(Ty, 3)
ShowLabel(Ty, true)
SetCaption(Sh_x, "切变因子 Sh")
SetLabelMode(Sh_x, 3)
ShowLabel(Sh_x, true)
SetCaption(Sc_x, "水平缩放 Sx")
SetLabelMode(Sc_x, 3)
ShowLabel(Sc_x, true)
SetCaption(Sc_y, "垂直缩放 Sy")
SetLabelMode(Sc_y, 3)
ShowLabel(Sc_y, true)
ShowLabel(Curve_orig, false)
ShowLabel(Curve_trans, false)`,
            }
          }
        }
      };
      let elem = document.querySelector(".contentItemArea");
      webCpu.updateView(elem, app);
    });
  </script>
</body>

</html>
