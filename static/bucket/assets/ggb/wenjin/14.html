<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>拉格朗日中值定理平行移动</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: "Nunito", "Noto Sans", sans-serif;
      overflow: hidden;
      box-sizing: border-box;
    }

    .contentItemArea {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
    }


    @keyframes hueShift {
      0% {
        filter: hue-rotate(0deg);
      }

      100% {
        filter: hue-rotate(360deg);
      }
    }

    .fade-out {
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    .loadingTips {
      text-align: center;
      font-size: 12px;
      color: #ccc;
      padding: 20px 0;
    }

    .waiting {
      width: 60px;
      height: 60px;
      background-color: #67cf22;
      margin: 100px auto;
      animation: rotateplane 1.2s infinite ease-in-out;
    }

    @keyframes rotateplane {
      0% {
        transform: perspective(120px) rotateX(0deg) rotateY(0deg);
      }

      50% {
        transform: perspective(120px) rotateX(-180deg) rotateY(0deg);
      }

      100% {
        transform: perspective(120px) rotateX(-180deg) rotateY(-179.9deg);
      }
    }

    .__exporting__,
    .__exporting * {
      animation: none !important;
      transition: none !important;
    }

    .__exporting {
      background: #ffffff !important;
    }

    .__export-mask {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      background: rgba(250, 250, 250, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .__export-mask__panel {
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 16px 22px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
    }

    .__export-mask__spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div class="contentItemArea">
    <div class="loadingTips">加载中...</div>
    <div class="waiting"></div>
  </div>
  <script defer src="https://transweb.cn/index.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      let app = {
        className: "GeogebraCase",
        task: {
          data: {
            name: "拉格朗日中值定理平行移动",
            mode: "2D",
            appName: "suite",
            perspective: "graphing",
            language: "zh-CN",
            version: 5.0,
            script: {
              value: `SetCoordSystem(-8,8,-8,8)
ShowGrid(true)
ShowAxes(true)
T = Slider(0, 1, 0.01, 1, 150)
a = -5
b = 5
f(x) = 0.1*x^3 - 0.5*x + 1
A = (a, f(a))
B = (b, f(b))
S = Segment(A, B)
SetLineThickness(S, 2)
SetColor(S, "#888888")
SetLineStyle(S, 2)
k = (f(b) - f(a)) / (b - a)
g(x) = f(x) - k*x
c = Root(g', x, a, b)
P = (c, f(c))
L_t = A + T*Vector(A, B)
Q = (x(L_t), f(x(L_t)))
Tan = Tangent(P, f)
SetLineThickness(Tan, 3)
SetColor(Tan, "#FF5722")
Move = Segment(L_t, Q)
SetLineThickness(Move, 2)
SetColor(Move, "#2196F3")
SetLineStyle(Move, 3)
SetPointSize(A, 4)
SetColor(A, "#4CAF50")
SetPointSize(B, 4)
SetColor(B, "#4CAF50")
SetPointSize(P, 6)
SetColor(P, "#FF5722")
SetCaption(P, "切点 P")
SetLabelMode(P, 3)
ShowLabel(P, true)
SetCaption(T, "平行移动 t")
SetLabelMode(T, 3)
ShowLabel(T, true)
ShowObject(L_t, false)
ShowLabel(L_t, false)
ShowLabel(A, false)
ShowLabel(B, false)
ShowLabel(S, false)
ShowLabel(Move, false)
ShowLabel(Tan, false)
ShowLabel(f, false)
ShowLabel(g, false)
ShowLabel(k, false)
ShowLabel(c, false)
ShowLabel(Q, false)`,
            }
          }
        }
      };
      let elem = document.querySelector(".contentItemArea");
      webCpu.updateView(elem, app);
    });
  </script>
</body>

</html>
