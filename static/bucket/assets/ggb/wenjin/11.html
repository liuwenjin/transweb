<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>二元函数等高线切片</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: "Nunito", "Noto Sans", sans-serif;
      overflow: hidden;
      box-sizing: border-box;
    }

    .contentItemArea {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
    }


    @keyframes hueShift {
      0% {
        filter: hue-rotate(0deg);
      }

      100% {
        filter: hue-rotate(360deg);
      }
    }

    .fade-out {
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    .loadingTips {
      text-align: center;
      font-size: 12px;
      color: #ccc;
      padding: 20px 0;
    }

    .waiting {
      width: 60px;
      height: 60px;
      background-color: #67cf22;
      margin: 100px auto;
      animation: rotateplane 1.2s infinite ease-in-out;
    }

    @keyframes rotateplane {
      0% {
        transform: perspective(120px) rotateX(0deg) rotateY(0deg);
      }

      50% {
        transform: perspective(120px) rotateX(-180deg) rotateY(0deg);
      }

      100% {
        transform: perspective(120px) rotateX(-180deg) rotateY(-179.9deg);
      }
    }

    .__exporting__,
    .__exporting * {
      animation: none !important;
      transition: none !important;
    }

    .__exporting {
      background: #ffffff !important;
    }

    .__export-mask {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      background: rgba(250, 250, 250, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .__export-mask__panel {
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 16px 22px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
    }

    .__export-mask__spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div class="contentItemArea">
    <div class="loadingTips">加载中...</div>
    <div class="waiting"></div>
  </div>
  <script defer src="https://transweb.cn/index.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      let app = {
        className: "GeogebraCase",
        task: {
          data: {
            name: "二元函数等高线切片",
            mode: "3D",
            appName: "3d",
            perspective: "3d",
            language: "zh-CN",
            version: 5.0,
            script: {
              value: `SetCoordSystem(-8, 8, -8, 8, -8, 8)
ShowGrid(false)
ShowAxes(true)
ShowLabel(axes, false)

H_slice = Slider(0, 5, 0.1, 1, 150)
SetCaption(H_slice, "水平切面高度 H = ")
SetLabelMode(H_slice, 3)
ShowLabel(H_slice, true)

f(x, y) = 5 * exp(-(x^2 + y^2) / 8)
Surf_main = Surface(u, v, f(u, v), u, -4, 4, v, -4, 4)
SetColor(Surf_main, "#3498DB")
SetFilling(Surf_main, 0.45)
SetLineThickness(Surf_main, 0)

Plane_cut = Surface(u, v, H_slice, u, -4, 4, v, -4, 4)
SetColor(Plane_cut, "#E74C3C")
SetFilling(Plane_cut, 0.3)
SetLineThickness(Plane_cut, 0)

Curve_contour = IntersectPath(Surf_main, Plane_cut)
SetColor(Curve_contour, "#F1C40F")
SetLineThickness(Curve_contour, 5)

Proj_contour = Curve(x(Curve_contour(t)), y(Curve_contour(t)), -5, t, 0, 1)
SetColor(Proj_contour, "#E67E22")
SetLineThickness(Proj_contour, 4)

Label_3D = Text3D("切面", (4, 4, H_slice + 0.5), false, true)
SetColor(Label_3D, "#E74C3C")
ShowLabel(Label_3D, false)

Label_proj = Text("投影等高线", (-5, -6), false, true)
SetColor(Label_proj, "#E67E22")
ShowLabel(Label_proj, false)

ShowObject(Label_3D, false)
ShowLabel(Label_3D, false)
ShowObject(Label_proj, false)
ShowLabel(Label_proj, false)`,
            }
          }
        }
      };
      let elem = document.querySelector(".contentItemArea");
      webCpu.updateView(elem, app);
    });
  </script>
</body>

</html>
