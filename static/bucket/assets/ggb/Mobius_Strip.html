<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Mobius_Strip</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: "Nunito", "Noto Sans", sans-serif;
      overflow: hidden;
      box-sizing: border-box;
    }

    .contentItemArea {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
    }


    @keyframes hueShift {
      0% {
        filter: hue-rotate(0deg);
      }

      100% {
        filter: hue-rotate(360deg);
      }
    }

    .fade-out {
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    .loadingTips {
      text-align: center;
      font-size: 12px;
      color: #ccc;
      padding: 20px 0;
    }

    .waiting {
      width: 60px;
      height: 60px;
      background-color: #67cf22;
      margin: 100px auto;
      animation: rotateplane 1.2s infinite ease-in-out;
    }

    @keyframes rotateplane {
      0% {
        transform: perspective(120px) rotateX(0deg) rotateY(0deg);
      }

      50% {
        transform: perspective(120px) rotateX(-180deg) rotateY(0deg);
      }

      100% {
        transform: perspective(120px) rotateX(-180deg) rotateY(-179.9deg);
      }
    }

    .__exporting__,
    .__exporting * {
      animation: none !important;
      transition: none !important;
    }

    .__exporting {
      background: #ffffff !important;
    }

    .__export-mask {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      background: rgba(250, 250, 250, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .__export-mask__panel {
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 16px 22px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
    }

    .__export-mask__spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div class="contentItemArea">
    <div class="loadingTips">加载中...</div>
    <div class="waiting"></div>
  </div>
  <script defer src="https://transweb.cn/index.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      let app = {
        className: "GeogebraCase",
        task: {
          data: {
            name: "Mobius_Strip",
            mode: "3D",
            appName: "3d",
            perspective: "3d",
            language: "zh-CN",
            version: 5.0,
            script: {
              value: `SetCoordSystem(-8,8,-8,8,-8,8)
ShowGrid(false)
ShowAxes(true)
Twist_k = Slider(0, 3, 0.01, 1, 150)
SetCaption(Twist_k, "$\\text{扭转半圈数 } k$")
SetLabelMode(Twist_k, 3)
ShowLabel(Twist_k, true)
SetValue(Twist_k, 1)
Radius_R = Slider(1, 5, 0.1, 1, 150)
SetCaption(Radius_R, "$\\text{环半径 } R$")
SetLabelMode(Radius_R, 3)
ShowLabel(Radius_R, true)
SetValue(Radius_R, 3)
Width_w = Slider(0.3, 2, 0.1, 1, 150)
SetCaption(Width_w, "$\\text{带宽 } w$")
SetLabelMode(Width_w, 3)
ShowLabel(Width_w, true)
SetValue(Width_w, 1)
Surf_m = Surface((Radius_R + u * cos(Twist_k * v / 2)) * cos(v), (Radius_R + u * cos(Twist_k * v / 2)) * sin(v), u * sin(Twist_k * v / 2), u, -Width_w, Width_w, v, 0, 2 * pi)
SetColor(Surf_m, "#2196F3")
SetFilling(Surf_m, 0.55)
SetLineThickness(Surf_m, 0)
Aux_c = Curve((Radius_R * cos(t), Radius_R * sin(t), 0), t, 0, 2 * pi)
SetColor(Aux_c, "#FF5722")
SetLineThickness(Aux_c, 3)
SetCaption(Aux_c, "$\\text{中心线}$")
SetLabelMode(Aux_c, 3)
ShowLabel(Aux_c, true)
Aux_e = Curve(((Radius_R + Width_w * cos(Twist_k * t / 2)) * cos(t), (Radius_R + Width_w * cos(Twist_k * t / 2)) * sin(t), Width_w * sin(Twist_k * t / 2)), t, 0, 2 * pi)
SetColor(Aux_e, "#4CAF50")
SetLineThickness(Aux_e, 2)
SetCaption(Aux_e, "$\\text{边界线}$")
SetLabelMode(Aux_e, 3)
ShowLabel(Aux_e, true)`,
            }
          }
        }
      };
      let elem = document.querySelector(".contentItemArea");
      webCpu.updateView(elem, app);
    });
  </script>
</body>

</html>
