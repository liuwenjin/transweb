<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Cube_Section</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: "Nunito", "Noto Sans", sans-serif;
      overflow: hidden;
      box-sizing: border-box;
    }

    .contentItemArea {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
    }


    @keyframes hueShift {
      0% {
        filter: hue-rotate(0deg);
      }

      100% {
        filter: hue-rotate(360deg);
      }
    }

    .fade-out {
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    .loadingTips {
      text-align: center;
      font-size: 12px;
      color: #ccc;
      padding: 20px 0;
    }

    .waiting {
      width: 60px;
      height: 60px;
      background-color: #67cf22;
      margin: 100px auto;
      animation: rotateplane 1.2s infinite ease-in-out;
    }

    @keyframes rotateplane {
      0% {
        transform: perspective(120px) rotateX(0deg) rotateY(0deg);
      }

      50% {
        transform: perspective(120px) rotateX(-180deg) rotateY(0deg);
      }

      100% {
        transform: perspective(120px) rotateX(-180deg) rotateY(-179.9deg);
      }
    }

    .__exporting__,
    .__exporting * {
      animation: none !important;
      transition: none !important;
    }

    .__exporting {
      background: #ffffff !important;
    }

    .__export-mask {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      background: rgba(250, 250, 250, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .__export-mask__panel {
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 16px 22px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
    }

    .__export-mask__spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div class="contentItemArea">
    <div class="loadingTips">加载中...</div>
    <div class="waiting"></div>
  </div>
  <script defer src="https://transweb.cn/index.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      let app = {
        className: "GeogebraCase",
        task: {
          data: {
            name: "Cube_Section",
            mode: "3D",
            appName: "3d",
            perspective: "3d",
            language: "zh-CN",
            version: 5.0,
            script: {
              value: `SetCoordSystem(-8,8,-8,8,-8,8)
ShowGrid(false)
ShowAxes(true)
Cut_t = Slider(0.1, 1, 0.01, 1, 150)
SetCaption(Cut_t, "$\\text{切割位置 } t$")
SetLabelMode(Cut_t, 3)
ShowLabel(Cut_t, true)
Edge_l = 4
Aux_O = (0, 0, 0)
Aux_A = (Edge_l, 0, 0)
Aux_B = (Edge_l, Edge_l, 0)
Aux_C = (0, Edge_l, 0)
Aux_D = (0, 0, Edge_l)
Aux_E = (Edge_l, 0, Edge_l)
Aux_F = (Edge_l, Edge_l, Edge_l)
Aux_G = (0, Edge_l, Edge_l)
Face_b = Polygon(Aux_O, Aux_A, Aux_B, Aux_C)
SetColor(Face_b, "#4A90D9")
SetFilling(Face_b, 0.08)
Face_t = Polygon(Aux_D, Aux_E, Aux_F, Aux_G)
SetColor(Face_t, "#4A90D9")
SetFilling(Face_t, 0.08)
Face_f = Polygon(Aux_O, Aux_A, Aux_E, Aux_D)
SetColor(Face_f, "#4A90D9")
SetFilling(Face_f, 0.08)
Face_r = Polygon(Aux_A, Aux_B, Aux_F, Aux_E)
SetColor(Face_r, "#4A90D9")
SetFilling(Face_r, 0.08)
Face_k = Polygon(Aux_B, Aux_C, Aux_G, Aux_F)
SetColor(Face_k, "#4A90D9")
SetFilling(Face_k, 0.08)
Face_l = Polygon(Aux_C, Aux_O, Aux_D, Aux_G)
SetColor(Face_l, "#4A90D9")
SetFilling(Face_l, 0.08)
P_1 = (Edge_l * Cut_t, 0, 0)
P_2 = (Edge_l, Edge_l * Cut_t, 0)
P_3 = (Edge_l - Edge_l * Cut_t, Edge_l, 0)
P_4 = (0, Edge_l - Edge_l * Cut_t, 0)
P_5 = (0, 0, Edge_l * Cut_t)
P_6 = (Edge_l * Cut_t, 0, Edge_l)
Sec_P1 = P_1 + (1 - Cut_t) * (Aux_E - Aux_A) + Cut_t * (Aux_D - Aux_O)
Sec_P2 = (Edge_l * Cut_t, 0, Edge_l * Cut_t)
Sec_P3 = (Edge_l, Edge_l * Cut_t, Edge_l * Cut_t)
Sec_P4 = (Edge_l * (1 - Cut_t), Edge_l, Edge_l * Cut_t)
Sec_P5 = (0, Edge_l * (1 - Cut_t), Edge_l * Cut_t)
Sec_Q1 = (Edge_l * Cut_t, 0, 0)
Sec_Q2 = (Edge_l, Edge_l * Cut_t, 0)
Sec_Q3 = (Edge_l, Edge_l, Edge_l * Cut_t)
Sec_Q4 = (Edge_l * (1 - Cut_t), Edge_l, Edge_l)
Sec_Q5 = (0, Edge_l * (1 - Cut_t), Edge_l)
Sec_Q6 = (0, 0, Edge_l * (1 - Cut_t))
Sect_s = Polygon(Sec_Q1, Sec_Q2, Sec_Q3, Sec_Q4, Sec_Q5, Sec_Q6)
SetColor(Sect_s, "#E74C3C")
SetFilling(Sect_s, 0.55)
SetLineThickness(Sect_s, 4)
SetCaption(Sect_s, "$\\text{截面}$")
SetLabelMode(Sect_s, 3)
ShowLabel(Sect_s, true)
ShowObject(Aux_O, false)
ShowLabel(Aux_O, false)
ShowObject(Aux_A, false)
ShowLabel(Aux_A, false)
ShowObject(Aux_B, false)
ShowLabel(Aux_B, false)
ShowObject(Aux_C, false)
ShowLabel(Aux_C, false)
ShowObject(Aux_D, false)
ShowLabel(Aux_D, false)
ShowObject(Aux_E, false)
ShowLabel(Aux_E, false)
ShowObject(Aux_F, false)
ShowLabel(Aux_F, false)
ShowObject(Aux_G, false)
ShowLabel(Aux_G, false)
ShowObject(P_1, false)
ShowLabel(P_1, false)
ShowObject(P_2, false)
ShowLabel(P_2, false)
ShowObject(P_3, false)
ShowLabel(P_3, false)
ShowObject(P_4, false)
ShowLabel(P_4, false)
ShowObject(P_5, false)
ShowLabel(P_5, false)
ShowObject(P_6, false)
ShowLabel(P_6, false)
ShowObject(Sec_P1, false)
ShowLabel(Sec_P1, false)
ShowObject(Sec_P2, false)
ShowLabel(Sec_P2, false)
ShowObject(Sec_P3, false)
ShowLabel(Sec_P3, false)
ShowObject(Sec_P4, false)
ShowLabel(Sec_P4, false)
ShowObject(Sec_P5, false)
ShowLabel(Sec_P5, false)
ShowObject(Sec_Q1, false)
ShowLabel(Sec_Q1, false)
ShowObject(Sec_Q2, false)
ShowLabel(Sec_Q2, false)
ShowObject(Sec_Q3, false)
ShowLabel(Sec_Q3, false)
ShowObject(Sec_Q4, false)
ShowLabel(Sec_Q4, false)
ShowObject(Sec_Q5, false)
ShowLabel(Sec_Q5, false)
ShowObject(Sec_Q6, false)
ShowLabel(Sec_Q6, false)
ShowLabel(Face_b, false)
ShowLabel(Face_t, false)
ShowLabel(Face_f, false)
ShowLabel(Face_r, false)
ShowLabel(Face_k, false)
ShowLabel(Face_l, false)`,
            }
          }
        }
      };
      let elem = document.querySelector(".contentItemArea");
      webCpu.updateView(elem, app);
    });
  </script>
</body>

</html>
