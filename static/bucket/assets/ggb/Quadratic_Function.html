<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Quadratic_Function_Explorer</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: "Nunito", "Noto Sans", sans-serif;
      overflow: hidden;
      box-sizing: border-box;
    }

    .contentItemArea {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
    }


    @keyframes hueShift {
      0% {
        filter: hue-rotate(0deg);
      }

      100% {
        filter: hue-rotate(360deg);
      }
    }

    .fade-out {
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    .loadingTips {
      text-align: center;
      font-size: 12px;
      color: #ccc;
      padding: 20px 0;
    }

    .waiting {
      width: 60px;
      height: 60px;
      background-color: #67cf22;
      margin: 100px auto;
      animation: rotateplane 1.2s infinite ease-in-out;
    }

    @keyframes rotateplane {
      0% {
        transform: perspective(120px) rotateX(0deg) rotateY(0deg);
      }

      50% {
        transform: perspective(120px) rotateX(-180deg) rotateY(0deg);
      }

      100% {
        transform: perspective(120px) rotateX(-180deg) rotateY(-179.9deg);
      }
    }

    .__exporting__,
    .__exporting * {
      animation: none !important;
      transition: none !important;
    }

    .__exporting {
      background: #ffffff !important;
    }

    .__export-mask {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      background: rgba(250, 250, 250, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .__export-mask__panel {
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 16px 22px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
    }

    .__export-mask__spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div class="contentItemArea">
    <div class="loadingTips">加载中...</div>
    <div class="waiting"></div>
  </div>
  <script defer src="https://transweb.cn/index.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      let app = {
        className: "GeogebraCase",
        task: {
          data: {
            name: "Quadratic_Function_Explorer",
            mode: "2D",
            appName: "suite",
            perspective: "graphing",
            language: "zh-CN",
            version: 5.0,
            script: {
              value: `SetCoordSystem(-8, 8, -8, 8)
ShowGrid(true)
ShowAxes(true)
Coeff_a = Slider(-3, 3, 0.1, 1, 150)
SetCaption(Coeff_a, "$a = " + Coeff_a + "$")
SetLabelMode(Coeff_a, 3)
ShowLabel(Coeff_a, true)
Coeff_b = Slider(-6, 6, 0.1, 1, 150)
SetCaption(Coeff_b, "$b = " + Coeff_b + "$")
SetLabelMode(Coeff_b, 3)
ShowLabel(Coeff_b, true)
Coeff_c = Slider(-5, 5, 0.1, 1, 150)
SetCaption(Coeff_c, "$c = " + Coeff_c + "$")
SetLabelMode(Coeff_c, 3)
ShowLabel(Coeff_c, true)
f(x) = Coeff_a * x^2 + Coeff_b * x + Coeff_c
Parabola_f = f(x)
SetColor(Parabola_f, "#2E86DE")
SetLineThickness(Parabola_f, 4)
Axis_x = -Coeff_b / (2 * Coeff_a)
Vertex_y = f(Axis_x)
Vertex_V = (Axis_x, Vertex_y)
SetPointSize(Vertex_V, 5)
SetColor(Vertex_V, "#EE5A6F")
SetCaption(Vertex_V, "$\\text{顶点} (" + Round(Axis_x, 2) + ", " + Round(Vertex_y, 2) + ")$")
SetLabelMode(Vertex_V, 3)
ShowLabel(Vertex_V, true)
Symmetry_L = Line((Axis_x, -8), (Axis_x, 8))
SetColor(Symmetry_L, "#10AC84")
SetLineThickness(Symmetry_L, 2)
SetLineStyle(Symmetry_L, 2)
SetCaption(Symmetry_L, "$\\text{对称轴 } x = " + Round(Axis_x, 2) + "$")
SetLabelMode(Symmetry_L, 3)
ShowLabel(Symmetry_L, true)
Intercept_P = (0, Coeff_c)
SetPointSize(Intercept_P, 4)
SetColor(Intercept_P, "#FD79A8")
SetCaption(Intercept_P, "$y\\text{-截距} (0, " + Round(Coeff_c, 2) + ")$")
SetLabelMode(Intercept_P, 3)
ShowLabel(Intercept_P, true)`,
            }
          }
        }
      };
      let elem = document.querySelector(".contentItemArea");
      webCpu.updateView(elem, app);
    });
  </script>
</body>

</html>
