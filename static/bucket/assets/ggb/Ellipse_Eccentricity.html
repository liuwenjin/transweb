<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Ellipse_Eccentricity_Lab</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: "Nunito", "Noto Sans", sans-serif;
      overflow: hidden;
      box-sizing: border-box;
    }

    .contentItemArea {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
    }


    @keyframes hueShift {
      0% {
        filter: hue-rotate(0deg);
      }

      100% {
        filter: hue-rotate(360deg);
      }
    }

    .fade-out {
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    .loadingTips {
      text-align: center;
      font-size: 12px;
      color: #ccc;
      padding: 20px 0;
    }

    .waiting {
      width: 60px;
      height: 60px;
      background-color: #67cf22;
      margin: 100px auto;
      animation: rotateplane 1.2s infinite ease-in-out;
    }

    @keyframes rotateplane {
      0% {
        transform: perspective(120px) rotateX(0deg) rotateY(0deg);
      }

      50% {
        transform: perspective(120px) rotateX(-180deg) rotateY(0deg);
      }

      100% {
        transform: perspective(120px) rotateX(-180deg) rotateY(-179.9deg);
      }
    }

    .__exporting__,
    .__exporting * {
      animation: none !important;
      transition: none !important;
    }

    .__exporting {
      background: #ffffff !important;
    }

    .__export-mask {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      background: rgba(250, 250, 250, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .__export-mask__panel {
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 16px 22px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
    }

    .__export-mask__spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div class="contentItemArea">
    <div class="loadingTips">加载中...</div>
    <div class="waiting"></div>
  </div>
  <script defer src="https://transweb.cn/index.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      let app = {
        className: "GeogebraCase",
        task: {
          data: {
            name: "Ellipse_Eccentricity_Lab",
            mode: "2D",
            appName: "suite",
            perspective: "graphing",
            language: "zh-CN",
            version: 5.0,
            script: {
              value: `SetCoordSystem(-8, 8, -6, 6)
ShowGrid(true)
ShowAxes(true)
SemiA = Slider(1, 7, 0.01, 1, 150)
SetCaption(SemiA, "$\\text{半长轴 } a$")
SetLabelMode(SemiA, 3)
ShowLabel(SemiA, true)
Ecc = Slider(0, 0.99, 0.01, 1, 150)
SetCaption(Ecc, "$\\text{离心率 } e$")
SetLabelMode(Ecc, 3)
ShowLabel(Ecc, true)
FocDist = SemiA * Ecc
SemiB = SemiA * sqrt(1 - Ecc^2)
F1 = (-FocDist, 0)
SetPointSize(F1, 4)
SetColor(F1, "#E74C3C")
SetCaption(F1, "$F_1$")
SetLabelMode(F1, 3)
ShowLabel(F1, true)
F2 = (FocDist, 0)
SetPointSize(F2, 4)
SetColor(F2, "#E74C3C")
SetCaption(F2, "$F_2$")
SetLabelMode(F2, 3)
ShowLabel(F2, true)
Center_O = (0, 0)
SetPointSize(Center_O, 3)
SetColor(Center_O, "#2C3E50")
SetCaption(Center_O, "$O$")
SetLabelMode(Center_O, 3)
ShowLabel(Center_O, true)
Ellipse_c = Ellipse(F1, F2, SemiA)
SetColor(Ellipse_c, "#2980B9")
SetLineThickness(Ellipse_c, 4)
ShowLabel(Ellipse_c, false)
Aux_A = (SemiA, 0)
Aux_B = (0, SemiB)
Seg_a = Segment(Center_O, Aux_A)
SetColor(Seg_a, "#E67E22")
SetLineThickness(Seg_a, 2)
SetLineStyle(Seg_a, 1)
SetCaption(Seg_a, "$a$")
SetLabelMode(Seg_a, 3)
ShowLabel(Seg_a, true)
Seg_b = Segment(Center_O, Aux_B)
SetColor(Seg_b, "#27AE60")
SetLineThickness(Seg_b, 2)
SetLineStyle(Seg_b, 1)
SetCaption(Seg_b, "$b$")
SetLabelMode(Seg_b, 3)
ShowLabel(Seg_b, true)
Seg_c = Segment(Center_O, F2)
SetColor(Seg_c, "#E74C3C")
SetLineThickness(Seg_c, 2)
SetLineStyle(Seg_c, 2)
SetCaption(Seg_c, "$c$")
SetLabelMode(Seg_c, 3)
ShowLabel(Seg_c, true)
Info_t = Text("e = " + Round(Ecc * 100) / 100 + "  a = " + Round(SemiA * 100) / 100 + "  b = " + Round(SemiB * 100) / 100 + "  c = " + Round(FocDist * 100) / 100, (-7.5, 5.2))
SetColor(Info_t, "#2C3E50")
ShowLabel(Info_t, false)
ShowObject(Aux_A, false)
ShowLabel(Aux_A, false)
ShowObject(Aux_B, false)
ShowLabel(Aux_B, false)
ShowObject(FocDist, false)
ShowObject(SemiB, false)`,
            }
          }
        }
      };
      let elem = document.querySelector(".contentItemArea");
      webCpu.updateView(elem, app);
    });
  </script>
</body>

</html>
