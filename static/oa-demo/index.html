<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>院系文档权限与审批 OA · 三角色演示</title>
  <meta name="description" content="院系文档权限与审批 OA 系统三角色交互演示：普通用户、审批人、文档管理员" />

  <!-- Tailwind 运行时（项目本地 Play CDN，内网可用）；使用 tw- 前缀，避免与平台既有样式冲突 -->
  <script src="/common/tailwindcss.js"></script>
  <script>
    window.tailwind = window.tailwind || {};
    tailwind.config = {
      prefix: "tw-",
      theme: {
        extend: {
          fontFamily: {
            sans: ["-apple-system", "BlinkMacSystemFont", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "sans-serif"]
          },
          boxShadow: {
            card: "0 1px 2px rgba(15,23,42,.04), 0 8px 24px -12px rgba(15,23,42,.12)"
          }
        }
      }
    };
  </script>

  <style>
    html, body, #app { height: 100%; }
    body {
      margin: 0;
      background: #f1f5f9;
      color: #0f172a;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    .oa-scroll { scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent; }
    .oa-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
    .oa-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    .oa-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .oa-scroll::-webkit-scrollbar-track { background: transparent; }

    .oa-icon { width: 1.15rem; height: 1.15rem; flex-shrink: 0; }
    .oa-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .oa-clamp-3 {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .oa-fade-enter-active, .oa-fade-leave-active { transition: opacity .18s ease; }
    .oa-fade-enter-from, .oa-fade-leave-to { opacity: 0; }

    .oa-pop-enter-active { transition: opacity .16s ease, transform .16s ease; }
    .oa-pop-leave-active { transition: opacity .12s ease, transform .12s ease; }
    .oa-pop-enter-from, .oa-pop-leave-to { opacity: 0; transform: translateY(6px) scale(.985); }

    .oa-toast-enter-active, .oa-toast-leave-active { transition: opacity .2s ease, transform .2s ease; }
    .oa-toast-enter-from, .oa-toast-leave-to { opacity: 0; transform: translateY(10px); }

    .oa-spin { animation: oa-spin 1s linear infinite; }
    @keyframes oa-spin { to { transform: rotate(360deg); } }

    .oa-skeleton {
      background: linear-gradient(90deg, #eef2f7 25%, #f8fafc 37%, #eef2f7 63%);
      background-size: 400% 100%;
      animation: oa-skeleton 1.4s ease infinite;
    }
    @keyframes oa-skeleton { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
  </style>
</head>

<body>
  <div id="app"></div>

  <script src="/transweb/components/ElementVueItem/vue.global.js"></script>
  <script src="/oa-demo/loader.js"></script>
  <script src="/oa-demo/icons.js"></script>
  <script src="/oa-demo/store.js"></script>
  <script src="/oa-demo/app.js"></script>
</body>

</html>
