<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>初始化管理员账号 | TransWeb 管理后台</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="TransWeb 初始化管理员账号。仅供管理员使用，请勿对外公开。" />
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: "Nunito", "Noto Sans", sans-serif;
      overflow: hidden;
      box-sizing: border-box;
    }

    .contentItemArea {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
    }

    .bottomInfo {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      /* 移除 line-height，改用 flex */
      display: none;
      align-items: center;
      /* 垂直居中核心 */
      justify-content: center;
      /* 水平居中核心 */

      height: 44px;
      /* 固定一个舒适的高度 */
      padding: 0 20px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(5px);
      border-top: 1px solid #eaeaea;
      font-size: 12px;
      color: #888;
      z-index: 1000;
      box-sizing: border-box;
    }

    /* 2. 修正菜单挂载区域 */
    .agentMenuArea {
      /* 移除 inline-block，移除固定宽高 */
      display: flex;
      align-items: center;
      margin-left: 12px;
      height: 40px;
      line-height: 40px;
      width: 500px;
      /* 撑满父容器高度以便内部对齐 */
      white-space: nowrap;
      /* 杜绝截图 1 中的文字换行 */
    }

    /* 3. 统一 ID 区域样式 */
    .documentId-wrapper {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .documentId {
      color: #666;
      text-decoration: none;
      font-family: monospace;
    }

    .documentId:hover {
      color: #000;
    }


    @keyframes hueShift {
      0% {
        filter: hue-rotate(0deg);
      }

      100% {
        filter: hue-rotate(360deg);
      }
    }

    .fade-out {
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    .loadingTips {
      text-align: center;
      font-size: 12px;
      color: #ccc;
      padding: 20px 0;
    }

    .waiting {
      width: 60px;
      height: 60px;
      background-color: #67cf22;
      margin: 100px auto;
      animation: rotateplane 1.2s infinite ease-in-out;
    }

    @keyframes rotateplane {
      0% {
        transform: perspective(120px) rotateX(0deg) rotateY(0deg);
      }

      50% {
        transform: perspective(120px) rotateX(-180deg) rotateY(0deg);
      }

      100% {
        transform: perspective(120px) rotateX(-180deg) rotateY(-179.9deg);
      }
    }

    .__exporting__,
    .__exporting * {
      animation: none !important;
      transition: none !important;
    }

    .__exporting {
      background: #ffffff !important;
    }

    .__export-mask {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      background: rgba(250, 250, 250, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .__export-mask__panel {
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 16px 22px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
    }

    .__export-mask__spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
  <!-- ===== Tailwind CSS ===== -->
  <script src="https://cdn.tailwindcss.com"></script>
 
  <script>
    tailwind.config = {
      prefix: 'tw-',
      theme: {
        extend: {
          colors: {
            brand: {
              bg: '#F7F8FC',
              panel: '#FFFFFF',
              border: '#E4E8F4',
              primary: '#5B6BFF',
              secondary: '#8B7CF8',
              text: '#1A1F3C',
              muted: '#6B7280',
              success: '#10B981',
              accent: '#F0F1FF'
            }
          },
          boxShadow: {
            soft: '0 2px 24px rgba(91,107,255,0.10)',
            card: '0 1px 4px rgba(26,31,60,0.06), 0 8px 32px rgba(91,107,255,0.08)',
            glow: '0 0 48px rgba(91,107,255,0.18)'
          }
        }
      }
    }
  </script>
</head>

<body>
  
  <iframe src="/admin.html?aScript=assets/animationScripts/initAdmin.js" style="width: 100%; height: 100%; border: 0;"></iframe>
 
</body>

</html>
